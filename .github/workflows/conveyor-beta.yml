name: Publish Kindling Beta

on:
  push:
    branches:
      - beta-*
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
          cache: gradle

      - name: Build JAR and generate Conveyor config
        run: ./gradlew writeConveyorConfig jar

      - uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: "1"
          extra_flags: -f ci-conveyor-beta.conf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}