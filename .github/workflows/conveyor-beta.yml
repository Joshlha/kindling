name: Publish Kindling Beta

on:
  push:
    branches:
      - beta-*
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
          cache: gradle

      - name: Build JAR and generate Conveyor config
        run: ./gradlew writeConveyorConfig jar

      - uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: "1"
          command: make copied-site
          extra_flags: -f ci-conveyor-beta.conf
        env:
          OAUTH_TOKEN: ${{ secrets.OAUTH_TOKEN }}

      - name: Create index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages-beta https://x-access-token:${OAUTH_TOKEN}@github.com/Joshlha/kindling.git gh-pages
          cp gh-pages/download.html gh-pages/index.html
          cd gh-pages
          git add index.html
          git commit -m "Add index.html [skip ci]"
          git push
        env:
          OAUTH_TOKEN: ${{ secrets.OAUTH_TOKEN }}